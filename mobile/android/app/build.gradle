apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def selectedAbis = providers.gradleProperty('tabbyAbis').getOrElse('arm64-v8a').split(',', -1) as List
def supportedAbis = ['arm64-v8a', 'x86_64'] as Set
if (selectedAbis.any { !supportedAbis.contains(it) } || selectedAbis.toSet().size() != selectedAbis.size()) {
    throw new GradleException('tabbyAbis must contain distinct arm64-v8a or x86_64 values, with no empty entries')
}

android {
    namespace = 'org.tabby.android.prototype'
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = '36.0.0'
    ndkVersion = '27.3.13750724'
    defaultConfig {
        applicationId = 'org.tabby.android.prototype'
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 2
        versionName = '0.2.0-mobile-candidate'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters.addAll(selectedAbis) }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = '21' }
    signingConfigs {
        debug {
            storeFile = layout.buildDirectory.file('signing/android-prototype-debug.keystore').get().asFile
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }
    buildTypes {
        debug {
            // Debug signing is solely for standard test APK installation.
            debuggable = true
        }
        release {
            minifyEnabled = false
            signingConfig = null
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

def verifySshNativeLibraries = tasks.register('verifySshNativeLibraries') {
    doLast {
        selectedAbis.each { abi ->
            def library = file("src/main/jniLibs/${abi}/libtabby_ssh.so")
            if (!library.isFile()) {
                throw new GradleException("Missing real SSH library for ${abi}; run the documented Rust Android build first")
            }
        }
    }
}
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('NativeLibs')) {
        task.dependsOn(verifySshNativeLibraries)
    }
}

def createPrototypeDebugKeystore = tasks.register('createPrototypeDebugKeystore', Exec) {
    def destination = layout.buildDirectory.file('signing/android-prototype-debug.keystore')
    outputs.file(destination)
    onlyIf { !destination.get().asFile.isFile() }
    doFirst { destination.get().asFile.parentFile.mkdirs() }
    commandLine new File(System.getProperty('java.home'), 'bin/keytool'),
        '-genkeypair', '-noprompt', '-keystore', destination.get().asFile,
        '-storepass', 'android', '-alias', 'androiddebugkey', '-keypass', 'android',
        '-dname', 'CN=Tabby Android Prototype Test', '-keyalg', 'RSA', '-keysize', '2048', '-validity', '3650'
}
tasks.configureEach { task ->
    if (task.name == 'validateSigningDebug' || task.name == 'validateSigningDebugAndroidTest') {
        task.dependsOn(createPrototypeDebugKeystore)
    }
}
