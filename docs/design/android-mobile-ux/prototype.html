</style><body><header class="prototype-header"><strong>Tabby Android · 可点击设计稿</strong><span>设计提案 / 非真实产品</span><select id="picker" aria-label="选择设计状态"><option value="hosts">01 · 连接工作台</option><option value="connect">02 · 首次连接</option><option value="trust">03 · 首次主机校验</option><option value="tmux">04 · tmux 列表</option><option value="new-session">05 · 新建会话</option><option value="occupied">06 · 已被使用</option><option value="takeover">07 · 显式接管</option><option value="terminal">08 · 专注终端 · 键盘关</option><option value="terminal-ime">09 · 专注终端 · 键盘开</option><option value="sessions">10 · 切换会话</option><option value="directions">11 · 方向键面板</option><option value="more">12 · 按需操作</option><option value="font">13 · 终端字号</option><option value="fold">14 · 展开 · 专注终端</option><option value="fold-ime">15 · 展开 · 键盘开</option><option value="fold-panel">16 · 展开 · 可选会话面板</option><option value="landscape">17 · 横屏短窗口</option><option value="selection">18 · 文本选择</option><option value="history">19 · 回看历史</option><option value="paste">20 · 多行粘贴确认</option><option value="readonly">21 · 只读会话</option><option value="mouse">22 · 显式鼠标模式</option><option value="mouse-active">23 · 鼠标模式活动</option><option value="offline">24 · 等待网络</option><option value="offline-details">25 · 恢复详情</option><option value="changed">26 · 主机密钥变化</option><option value="missing">27 · 恢复目标不存在</option><option value="collision">28 · 新建重名失败</option><option value="credentials">29 · 本地凭据</option><option value="update-password">30 · 更新密码</option><option value="update-failed">31 · 更新认证失败</option><option value="delete-password">32 · 删除密码确认</option><option value="deleted">33 · 密码已删除</option><option value="background">34 · 后台连接说明</option><option value="permission">35 · 通知权限解释</option><option value="permission-denied">36 · 通知权限拒绝</option><option value="notification">37 · 连接通知示意</option><option value="disconnect">38 · 断开当前连接</option><option value="stopped">39 · 用户停止</option></select><a href="review.html">设计评审包</a></header><p class="prototype-note">离线虚构流程；不连接 SSH、不读取剪贴板、不请求权限、不保存凭据。尺寸为假设窗口，系统键盘和通知为示意。</p><main class="stage" id="stage"></main><p class="prototype-note" id="note"></p><script type="application/json" id="models">{"hosts": {"label": "01 · 连接工作台", "html": "<div class=\"mobile \" data-state=\"hosts\"><div class=\"status\"><button class=\"identity\" data-screen=\"hosts\">连接<span class=\"\">此设备 · 本地<\/span><\/button><button class=\"icon\" data-screen=\"terminal-ime\" aria-label=\"显示键盘\">⌨<\/button><button class=\"icon\" data-screen=\"more\" aria-label=\"更多终端操作\">•••<\/button><\/div><div class=\"body\"><div class=\"eyebrow\">你的工作，随时接着做<\/div><h1>连接<\/h1><p>主机配置与活动会话分开。<br>密码仅在你选择后保存在此设备。<\/p><h2>正在进行<\/h2><button class=\"host\" data-screen=\"terminal\"><strong>work<\/strong><span>demo@lab.example · tmux<\/span><div class=badge>已连接<\/div><\/button><button class=\"host\" data-screen=\"offline\"><strong>logs<\/strong><span>demo@lab.example · tmux<\/span><div class=badge>待恢复<\/div><\/button><h2>主机<\/h2><button class=\"host\" data-screen=\"connect\"><strong>实验环境<\/strong><span>lab.example:22 · demo<\/span><\/button><button class=\"action\" data-screen=\"connect\">＋ 添加主机 / 快速连接<\/button><button class=\"action quiet\" data-screen=\"credentials\">密码与后台设置<\/button><\/div><\/div>", "note": "工作台保留连接入口；登录后不常驻主机表单。"}, "connect": {"label": "02 · 首次连接", "html": "<div class=\"mobile \" data-state=\"connect\"><div class=\"status\"><button class=\"identity\" data-screen=\"hosts\">新连接<span class=\"\">密码默认不保存<\/span><\/button><button class=\"icon\" data-screen=\"terminal-ime\" aria-label=\"显示键盘\">⌨<\/button><button class=\"icon\" data-screen=\"more\" aria-label=\"更多终端操作\">•••<\/button><\/div><div class=\"body\"><h1>连接主机<\/h1><label class=\"label\">主机<div class=\"field\">lab.example<\/div><\/label><label class=\"label\">端口<div class=\"field\">22<\/div><\/label><label class=\"label\">账号<div class=\"field\">demo<\/div><\/label><label class=\"label\">认证方式<div class=\"field\">密码<\/div><\/label><label class=\"label\">密码<div class=\"field\">••••••••<\/div><\/label><div class=\"check \"><span class=\"box\"><\/span>保存主机配置<\/div><div class=\"check \"><span class=\"box\"><\/span>在此设备保存密码<\/div><p class=\"small\">虚构字段；此设计稿不接受真实凭据。<br>仅主机校验与认证都成功后才保存密码。<\/p><button class=\"action\" data-screen=\"trust\">连接<\/button><button class=\"action quiet\" data-screen=\"hosts\">取消<\/button><\/div><\/div>", "note": ""}, "trust": {"label": "03 · 首次主机校验", "html": "<div class=\"mobile \" data-state=\"trust\"><div class=\"status\"><button class=\"identity\" data-screen=\"hosts\">新连接<span class=\"\">等待主机校验<\/span><\/button><button class=\"icon\" data-screen=\"terminal-ime\" aria-label=\"显示键盘\">⌨<\/button><button class=\"icon\" data-screen=\"more\" aria-label=\"更多终端操作\">•••<\/button><\/div><div class=\"body\"><\/div><div class=\"scrim\"><section class=\"sheet\"><div class=\"handle\"><\/div><h2>核对主机身份<\/h2><p>首次连接 lab.example:22。请与管理员提供的指纹核对，确认你正在连接正确主机。<\/p><div class=\"fingerprint\">ED25519 · SHA256<br>FICTITIOUS-DESIGN-FINGERPRINT<br>非真实主机密钥<\/div><p>接受后只在此设备记录。尚未发送认证密码。<\/p><button class=\"action\" data-screen=\"tmux\">已核对，信任并继续<\/button><button class=\"action secondary\" data-screen=\"hosts\">取消连接<\/button><\/section><\/div><\/div>", "note": ""}, "tmux": {"label": "04 · tmux 列表", "html": "<div class=\"mobile \" data-state=\"tmux\"><div class=\"status\"><button class=\"identity\" data-screen=\"hosts\">demo@lab.example<span class=\"\">选择终端会话<\/span><\/button><button class=\"icon\" data-screen=\"terminal-ime\" aria-label=\"显示键盘\">⌨<\/button><button class=\"icon\" data-screen=\"more\" aria-label=\"更多终端操作\">•••<\/button><\/div><div class=\"body\"><h1>接着工作<\/h1><p>tmux · 当前 socket: default<br>共享、只读与接管均由你选择。<\/p><button class=\"host\" data-screen=\"terminal\"><strong>work<\/strong><span>暂无客户端 · 点击恢复<\/span><\/button><button class=\"host\" data-screen=\"occupied\"><strong>logs<\/strong><span>已有 1 个客户端<\/span><\/button><button class=\"action\" data-screen=\"new-session\">＋ 新建会话<\/button><button class=\"action secondary\" \" aria-label=\"更多终端操作\">•••<\/button><\/div><div class=\"body\"><div class=\"eyebrow\">锁屏隐藏敏感信息<\/div><h1>后台连接已启用<\/h1><div class=\"card\"><strong>Tabby · 连接保持中<\/strong><p>2 个活动连接。系统仍可能停止应用。<\/p><button class=\"action secondary\" data-screen=\"terminal\">返回终端<\/button><button class=\"action secondary\" data-screen=\"stopped\">停止全部连接<\/button><\/div><p>通知只显示通用计数与操作，不显示主机、账号、密码或终端内容。<\/p><p>点停止将清除重连意图、关闭连接并停止服务，不终止远端 tmux 会话。<\/p><\/div><\/div>", "note": ""}, "disconnect": {"label": "38 · 断开当前连接", "html": "<div class=\"mobile \" data-state=\"disconnect\"><div class=\"status\"><button class=\"identity\" data-screen=\"sessions\">work · demo@lab.example<span class=\"\">已连接<\/span><\/button><button class=\"icon\" data-screen=\"terminal-ime\" aria-label=\"显示键盘\">⌨<\/button><button class=\"icon\" data-screen=\"more\" aria-label=\"更多终端操作\">•••<\/button><\/div><div class=\"terminal\"><pre><span class=\"dim\">demo@lab:~/project<\/span>\n<span class=\"green\">$ <\/span>npm run check\n\n> app@0.1.0 check\n> tsc --noEmit\n\n✓ 类型检查通过\n\n<span class=\"green\">$ <\/span>git status --short\n M src/main.ts\n\n<span class=\"green\">$ <\/span>printf \"你好，终端\\n\"\n你好，终端\n\n<span class=\"green\">$ <\/span>tmux display -p \"#S\"\nwork\n\n<span class=\"green\">$ <\/span>ls\nREADME.md  src  test\n\n<span class=\"green\">$ <\/span><span class=\"cursor\"> <\/span><\/pre><\/div><div class=\"scrim\"><section class=\"sheet\"><div class=\"handle\"><\/div><h2>断开 work？<\/h2><p>关闭此 SSH 连接并取消自动恢复。远端 tmux 会话中的进程继续运行。<\/p><button class=\"action danger\" data-screen=\"stopped\">断开此连接<\/button><button class=\"action secondary\" data-screen=\"terminal\">继续工作<\/button><\/section><\/div><\/div>", "note": ""}, "stopped": {"label": "39 · 用户停止", "html": "<div class=\"mobile \" data-state=\"stopped\"><div class=\"status\"><button class=\"identity\" data-screen=\"hosts\">连接<span class=\"\">用户已停止<\/span><\/button><button class=\"icon\" data-screen=\"terminal-ime\" aria-label=\"显示键盘\">⌨<\/button><button class=\"icon\" data-screen=\"more\" aria-label=\"更多终端操作\">•••<\/button><\/div><div class=\"body\"><h1>连接已停止<\/h1><p>没有待执行的自动重连。后台服务与连接通知已结束；远端 tmux 进程未被终止。<\/p><button class=\"host\" data-screen=\"tmux\"><strong>work<\/strong><span>已停止 · 需手动恢复<\/span><\/button><button class=\"action\" data-screen=\"connect\">手动连接 / 恢复<\/button><button class=\"action secondary\" data-screen=\"hosts\">返回工作台<\/button><\/div><\/div>", "note": ""}}</script><script>
const models=JSON.parse(document.getElementById('models').textContent);
const stage=document.getElementById('stage'), picker=document.getElementById('picker');
function show(name){if(!models[name])return;stage.innerHTML=models[name].html;picker.value=name;document.getElementById('note').textContent=models[name].note||'设计提案：按钮仅切换虚构状态，不执行真实操作。';document.body.dataset.current=name;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-screen]');if(b)show(b.dataset.screen);});
picker.addEventListener('change',()=>show(picker.value));window.designShow=show;window.designStates=Object.keys(models);
const q=new URLSearchParams(location.search);if(q.has('capture'))document.body.classList.add('capture');show(q.get('screen')||'hosts');
</script></body></html>
