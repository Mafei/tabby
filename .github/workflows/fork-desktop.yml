name: Fork desktop checks and artifacts
on:
  push:
    branches: [master, feature/ssh-tmux-recovery, feature/linux-portable-rocky8-fonts, candidate/desktop-uiux-v1.1, candidate/desktop-activity-dot-split-focus]
  pull_request:
    branches: [master, feature/ssh-tmux-recovery]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  CSC_LINK: ''
  CSC_KEY_PASSWORD: ''
  WIN_CSC_LINK: ''
  KEYGEN_TOKEN: ''
  APPLE_TEAM_ID: ''
  SM_KEYPAIR_ALIAS: ''
  TABBY_ARTIFACT_ONLY: '1'
jobs:
  checks:
    if: github.repository == 'Mafei/tabby' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Native and integration dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libsecret-1-dev libx11-dev tmux
      - name: Install
        id: install
        run: |
          npm install -g yarn@1.22.22
          yarn --frozen-lockfile --network-timeout 1000000
      - name: Prepare pinned app-local font resources
        run: python3 scripts/fonts/fetch-fonts.py
      - run: yarn test:ssh-term
        env:
          TABBY_TEST_TMUX: '1'
      - run: yarn test:ssh-integration
        env:
          TABBY_TEST_TMUX: '1'
      - run: yarn test:ui-chrome
      - run: yarn test:ui-desktop
      - run: yarn test:unit
        if: always() && steps.install.outcome == 'success'
      - run: yarn test:macos-artifact
        if: always() && steps.install.outcome == 'success'
      - run: yarn build:typings
        id: typings
        if: always() && steps.install.outcome == 'success'
      - run: yarn lint
        id: lint
        if: always() && steps.install.outcome == 'success'
      - run: yarn build
        if: always() && steps.typings.outcome == 'success'
  desktop:
    if: github.repository == 'Mafei/tabby' && github.event.repository.visibility == 'public'
    needs: checks
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2022
            platform: windows
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify standard Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test "$(node -p process.arch)" = arm64
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-apple-darwin
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libsecret-1-dev libx11-dev libarchive-tools
      - name: Install and build
        shell: bash
        run: |
          npm install -g yarn@1.22.22
          yarn --frozen-lockfile --network-timeout 1000000
          python3 scripts/fonts/fetch-fonts.py
          yarn build
          node scripts/prepackage-plugins.mjs
      - name: Windows VC runtime and UAC helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile build/vc_redist.exe
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          & $msbuild tabby-uac\UAC.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'UAC build failed' }
          $built = Get-ChildItem tabby-uac -Recurse -Filter UAC.exe | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          if (-not $built) { throw 'UAC.exe missing' }
          Copy-Item $built.FullName extras/UAC.exe
      - name: Package desktop artifact
        shell: bash
        run: node scripts/build-${{ matrix.platform }}.mjs
      - name: Verify macOS archives, complete signatures and startup
        if: runner.os == 'macOS'
        env:
          TABBY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verify-macos-arm64.mjs
      - name: Include VC runtime in portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $crt = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT' -Directory | Select-Object -First 1
          if (-not $crt) { throw 'VC runtime directory missing' }
          $portable = Get-ChildItem dist/*-portable-*.zip | Select-Object -First 1
          if (-not $portable) { throw 'Portable ZIP missing' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::Open($portable.FullName, 'Update')
          try {
            foreach ($name in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
              $source = Join-Path $crt.FullName $name
              if (-not (Test-Path $source)) { throw "Missing $name" }
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $source, $name) | Out-Null
            }
          } finally { $zip.Dispose() }
      - name: Record exact source and test archive hashes
        env:
          TABBY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/write-desktop-artifact-receipt.mjs
      - name: Include existing macOS manual-opening instructions
        if: runner.os == 'macOS'
        run: cp build/mac/TEST-BUILD.md dist/macos-arm64-TEST-BUILD.md
      - uses: actions/upload-artifact@v4
        # Every delivered package has an exact-source/byte-hash receipt.
        # Packaging scripts keep publish: never and empty signing credentials.
        with:
          name: tabby-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.platform == 'macos' && 'adhoc' || 'unsigned' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/macos-arm64-*.json
            dist/macos-arm64-TEST-BUILD.md
            dist/macos-arm64-smoke-*.png
            dist/macos-arm64-smoke-*.log
            dist/desktop-artifact-receipt.json
            dist/desktop-artifacts.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'macOS'
        with:
          name: tabby-macos-arm64-diagnostics
          path: |
            dist/macos-arm64-*.json
            dist/macos-arm64-smoke-*.log
            dist/macos-arm64-smoke-*.png
          if-no-files-found: warn
          retention-days: 14
  automatic-macos-gatekeeper-trust:
    # Reuse PR #10's separate trust assessment for this UI candidate. A rejected
    # adhoc package stays a failed trust gate; successful test packages remain
    # available for normal user per-app approval and device acceptance.
    needs: desktop
    if: github.repository == 'Mafei/tabby' && github.event.repository.visibility == 'public' && (github.head_ref || github.ref_name) == 'candidate/desktop-activity-dot-split-focus'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TABBY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tabby-macos-arm64-adhoc-${{ github.event.pull_request.head.sha || github.sha }}
          path: assessment
      - name: Require accepted automatic distribution assessment
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          files = list(Path('assessment').rglob('macos-arm64-verification.json'))
          assert len(files) == 1, 'Exact-source verification report missing'
          report = json.loads(files[0].read_text())
          assert report['sourceSHA'] == os.environ['TABBY_SOURCE_SHA']
          gate = report['gates']['automaticGatekeeperTrust']
          print(json.dumps(gate, indent=2))
          assert gate['passed'], 'Gatekeeper rejected the adhoc test package; manual user approval remains required and unverified on CI'
          PY
